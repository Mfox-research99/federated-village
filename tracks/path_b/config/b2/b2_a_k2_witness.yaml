# B2-A: K2 as Witness
# Hypothesis confirmed — K2's nullification instinct is role-appropriate in the Witness seat.
# This config predates the canonical default (config/default.yaml).
# Deviation from default: DeepSeek as Warden + Humanist + Supervisor (not GPT-4o-mini/Gemini).
# Reason: B2-A was designed to test K2 in Witness with DeepSeek anchoring the rest —
# DeepSeek is the most constitutionally rigorous frontier model on jury/supervisor seats.
# Retained for regression comparisons. New configs should deviate from default.yaml instead.

