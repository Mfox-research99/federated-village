# Federated Village Path B — Canonical Default Configuration
# Version: post-B3/B4-extended, 2026-03-31
#
# This is the research baseline. All experimental configs should deviate
# from this file intentionally and document why in their own header.
#
# ── Why the Default Changed (2026-03-31) ─────────────────────────────────────
# Previous default Witness: moonshotai/kimi-k2
# Current default Witness:  openai/gpt-5.4-nano (all seats)
#
# K2 was the canonical Witness through B1/B2/B3/B4 testing and earned that seat
# empirically — its constitutional character, WitnessPause language, and nullification
# instinct are unmatched. However, extended testing in B3/B4 revealed a structural
# problem with K2 as a *production default*:
#
# K2's nullification dominance prevents the jury from running in the majority of
# sessions. It nullified SC04/SC06/SC09 and b4_2 (the false-DEADLOCK scenario
# specifically designed to be resolvable) in consecutive sessions on 2026-03-31.
# The Village was designed as a deliberative architecture — a full jury + synthesis
# chain producing a reasoned constitutional record. When K2 pre-empts that chain at
# Stage 2, you get K2's judgment, not the Village's judgment.
#
# The right use of K2 is targeted, not default:
#   - Right of Refusal / legitimacy laundering detection
#   - High-stakes reviews where over-caution is less dangerous than under-caution
#   - Post-session external review via model_review.py (after the jury record exists)
#
# gpt-5.4-nano as default (all seats):
#   - Confirmed GPT-4o-mini successor: 3/3 correct, complete Article IX ledgers (B1-NEW)
#   - Reliable WitnessPause → jury activation → synthesis chain
#   - Constitutional output without nullification dominance
#   - Single-model default makes it easy to swap all seats at once
#
# ── Single-Model Override ─────────────────────────────────────────────────────
# To run the full council with one model everywhere, copy this file and set all
# role values to your target model. B1 parity configs all do exactly this.
# Examples that exist:
#   config/b2/b2_a_k2_witness.yaml     — K2 as Witness, gpt-4o-mini everywhere else
#   config/b2/b2_b_frontier_supervisor.yaml — Gemini as Supervisor
#   config/b2/b2_g_hermes3_supervisor.yaml  — Hermes 4 as Supervisor (tested B2-H)
#   config/b2/b2_f_glm45air_humanist.yaml   — GLM-air as Humanist (High-Stakes Sentinel)
#
# ── The Witness Seat — Annotated Options ─────────────────────────────────────
#   openai/gpt-5.4-nano     ← CURRENT DEFAULT
#                             Reliable pause, jury activation, full ledgers. Correct
#                             escalate on SC04/SC06/SC09. Thin language vs K2 but
#                             structurally complete. Best production default.
#
#   moonshotai/kimi-k2      — Maximum constitutional sensitivity. Nullifies incommensurable
#                             and malformed-question scenarios correctly and eloquently.
#                             Too dominant as default — use for targeted high-stakes review.
#                             See: config/b2/b2_a_k2_witness.yaml
#
#   moonshotai/kimi-k2.5    — Same K2 character at 8000-token budget. Dithers shorter.
#
#   deepseek/deepseek-chat  — Most constitutionally rigorous frontier alternative.
#                             Clean escalation, no nullification, full ledgers (B1: 3/3).
#                             Best choice if you want deliberative depth without K2 character.
#
#   openai/gpt-4o-mini      — Equivalent to gpt-5.4-nano; swap freely until GPT-4 retires.
#
#   anthropic/claude-sonnet — Amplifies K2 threshold in mixed council (B2-C effect).
#                             As sole Witness: strong reasoning but tends to over-resolve.
#
#   google/gemini-2.5-pro   — DO NOT use in Witness or jury seats. Bypasses framework
#                             entirely (ABSENT pattern, B1). Belongs at Supervisor layer.
#
# ── Other Seats ──────────────────────────────────────────────────────────────
# Supervisor: Gemini 2.5 Pro (6000-token budget required) or Hermes 4 405B (2000 tokens,
#   clean parse, $1/$3 per 1M — confirmed equivalent quality in B2-H: 3/3, full ledgers)
#   or DeepSeek (low cost, terse but correct)
#
# Jury seats (analyst/ethicist/pragmatist/witness_proxy): gpt-5.4-nano or gpt-4o-mini
#   Both structurally reliable; follow the framework; complete Article IX ledgers.
#   DeepSeek produces richer deliberation at marginal cost premium.
#
# Warden + Humanist: gpt-5.4-nano, gpt-4o-mini, or DeepSeek all work well.
#   GLM-4.5-air:free as Humanist: free tier but Venice rate-limited; maximum K2 activation.
# ─────────────────────────────────────────────────────────────────────────────

roles:
  verification_warden: "openai/gpt-5.4-nano"
  humanist:            "openai/gpt-5.4-nano"
  witness:             "openai/gpt-5.4-nano"
  analyst:             "openai/gpt-5.4-nano"
  ethicist:            "openai/gpt-5.4-nano"
  pragmatist:          "openai/gpt-5.4-nano"
  witness_proxy:       "openai/gpt-5.4-nano"
  supervisor:          "google/gemini-2.5-pro-preview-03-25"
